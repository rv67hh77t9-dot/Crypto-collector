<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Crypto Collector</title>

<style>

body {

  font-family: Arial, sans-serif;

  background: #101827;

  color: white;

  padding: 20px;

  text-align: center;

}

.card {

  background: #1e293b;

  border-radius: 15px;

  padding: 20px;

  margin-top: 20px;

}

h1 { color: #38bdf8; }

</style>

</head>

<body>

<h1>🪙 Crypto Collector</h1>

<p>Mon assistant de cryptomonnaies gratuites</p>

<div class="card">

<h2>🤖 Tableau de bord</h2>

<p>✅ Installation en cours</p>

<p>🔎 Recherche automatique : à configurer</p>

<p>💰 Gains reçus : 0 €</p>

<p>🔐 Portefeuille : Coinbase</p>

</div>

<div class="card">

<h2>🎁 Opportunités</h2>

<p>Les offres vérifiées apparaîtront ici.</p>

</div>
<div class="card">
  <h2>🔎 Articles détectés</h2>
  <div id="resultats">Chargement...</div>
</div>

<script>
async function charger() {
  const zone = document.getElementById("resultats");
  try {
    const r = await fetch("./results.json?t=" + Date.now());
    if (!r.ok) throw new Error("Chargement impossible");
    const data = await r.json();
    const articles = data.opportunites || [];
    zone.textContent = "";

    if (!articles.length) {
      zone.textContent = "Aucun article détecté.";
      return;
    }

    for (const article of articles) {
      const p = document.createElement("p");
      const a = document.createElement("a");
      a.href = article.lien;
      a.textContent = article.titre;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.color = "#38bdf8";
      p.appendChild(a);
      zone.appendChild(p);
    }
  } catch (e) {
    zone.textContent = "Résultats indisponibles.";
  }
}
charger();
</script>
</body>

</html>
