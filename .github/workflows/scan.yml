name: Crypto Collector - Recherche automatique

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recherche:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rechercher les opportunites
        run: python scan.py

      - name: Enregistrer les resultats
        run: |
          git config user.name "Crypto Collector Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation des opportunites crypto"
            git push
          fi
